<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1000" height="350" rx="16" fill="#ffffff"/>
  <text x="40" y="52" font-size="24" font-weight="700" fill="#1f2328">How CiteReady works</text>
  <text x="40" y="80" font-size="15" fill="#59636e">From a web page to a citation score and concrete suggestions</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
    </marker>
  </defs>

  <!-- Step boxes -->
  <g font-size="14" fill="#1f2328">
    <rect x="40" y="120" width="160" height="130" rx="12" fill="#eef4ff" stroke="#b6cdfb"/>
    <text x="60" y="152" font-weight="700" font-size="13" fill="#2f5bd3">1 · INPUT</text>
    <text x="60" y="180">Page URL or</text>
    <text x="60" y="200">WordPress post</text>
    <text x="60" y="220">+ target questions</text>

    <rect x="232" y="120" width="160" height="130" rx="12" fill="#eef4ff" stroke="#b6cdfb"/>
    <text x="252" y="152" font-weight="700" font-size="13" fill="#2f5bd3">2 · PASSAGES</text>
    <text x="252" y="180">Content split</text>
    <text x="252" y="200">into passages</text>
    <text x="252" y="220">and headings</text>

    <rect x="424" y="120" width="160" height="130" rx="12" fill="#eef4ff" stroke="#b6cdfb"/>
    <text x="444" y="152" font-weight="700" font-size="13" fill="#2f5bd3">3 · SIGNALS</text>
    <text x="444" y="180">Semantic similarity</text>
    <text x="444" y="200">Structure, schema</text>
    <text x="444" y="220">Author, freshness</text>
    <text x="444" y="240">Entities</text>

    <rect x="616" y="120" width="160" height="130" rx="12" fill="#e9f7ef" stroke="#a6dcb9"/>
    <text x="636" y="152" font-weight="700" font-size="13" fill="#1a7f45">4 · MODEL</text>
    <text x="636" y="180">Citation score</text>
    <text x="636" y="200">0 to 100 for</text>
    <text x="636" y="220">each question</text>

    <rect x="808" y="120" width="160" height="130" rx="12" fill="#fff5e6" stroke="#f2cc8f"/>
    <text x="828" y="152" font-weight="700" font-size="13" fill="#9a5b00">5 · REVIEW</text>
    <text x="828" y="180">Suggestions and</text>
    <text x="828" y="200">draft rewrites,</text>
    <text x="828" y="220">approved by</text>
    <text x="828" y="240">the editor</text>
  </g>

  <!-- Arrows -->
  <g stroke="#8c959f" stroke-width="2" marker-end="url(#a)">
    <line x1="202" y1="185" x2="228" y2="185"/>
    <line x1="394" y1="185" x2="420" y2="185"/>
    <line x1="586" y1="185" x2="612" y2="185"/>
    <line x1="778" y1="185" x2="804" y2="185"/>
  </g>

  <!-- Feedback loop -->
  <path d="M888,252 C888,300 120,300 120,254" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#a)"/>
  <text x="500" y="318" font-size="13" fill="#59636e" text-anchor="middle">Updated page is analysed again, and new citation data retrains the model</text>
</svg>
